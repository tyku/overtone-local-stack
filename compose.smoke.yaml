name: overtone-smoke

services:
  api:
    image: node:22.22.0-alpine3.23
    working_dir: /smoke
    command: [node, mock-api.mjs]
    volumes:
      - ./test/smoke/mock-api.mjs:/smoke/mock-api.mjs:ro
    ports:
      - "127.0.0.1:${SMOKE_API_PORT:-18081}:3000"
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/health]
      interval: 1s
      timeout: 2s
      retries: 15

  frontend-assets:
    build:
      context: ../overtone/frontend
      dockerfile: Dockerfile
      target: artifacts
    volumes:
      - frontend_dist:/output
    restart: "no"

  nginx:
    image: nginx:1.30.0-alpine
    ports:
      - "127.0.0.1:${SMOKE_FRONTEND_PORT:-18080}:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend-assets:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/nginx-health]
      interval: 1s
      timeout: 2s
      retries: 15

volumes:
  frontend_dist:
